
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <h:outputStylesheet name="css/mylayout.css"/>
    <h:outputScript name="js/script.js" target="head"/>
    <title>Conversation avec Gemini</title>
</h:head>

<h:body>
    <f:view>

        <h:messages errorStyle="color: red" showDetail="true"
                    showSummary="false" globalOnly="true"/>

        <h:form id="form">

            <p:outputLabel for="rolesysteme" value="Rôle de l'API : "/>

            <p:selectOneMenu id="rolesysteme"
                             value="#{bb.roleSysteme}"
                             editable="true"
                             required="true"
                             requiredMessage="Vous devez indiquer le rôle de l'API"
                             disabled="#{!bb.roleSystemeChangeable}">
                <f:selectItems value="#{bb.rolesSysteme}"/>
            </p:selectOneMenu>

            <h:message for="rolesysteme" errorStyle="color: red"/>

            <h:outputText value="  "/>
            <h:commandButton value="Nouveau chat"
                             action="#{bb.nouveauChat}"/>

            <h:panelGrid id="paneltotal" columns="2"
                         columnClasses="topAligned,topAligned">

                <h:panelGrid id="panelgauche" columns="1">

                    <h:panelGrid id="questionetreponse" columns="1">

                        <h:panelGroup>
                            <h:outputText value="Question :"/>
                            <button type="button"
                                    onclick="copyToClipboard('question')">
                                Copier question
                            </button>
                            <button type="button"
                                    onclick="toutEffacer()">
                                Effacer question et réponse
                            </button>
                        </h:panelGroup>

                        <h:inputTextarea id="question"
                                         value="#{bb.question}"
                                         title="Question"
                                         cols="50" rows="5"/>

                        <h:commandButton value="Envoyer la question"
                                         action="#{bb.envoyer}"/>

                        <h:panelGroup>
                            <h:outputText value="Réponse :"/>
                            <button type="button"
                                    onclick="copyToClipboard('reponse')">
                                Copier réponse
                            </button>
                        </h:panelGroup>

                        <h:inputTextarea id="reponse"
                                         value="#{bb.reponse}"
                                         title="Réponse"
                                         cols="50" rows="15"/>

                    </h:panelGrid>
                </h:panelGrid>

                <h:panelGrid id="paneldroit" columns="1"
                             style="vertical-align: top;">

                    <h:panelGroup>
                        <h:outputText value="Conversation :"/>
                        <button type="button"
                                onclick="copyToClipboard('conversation')">
                            Copier conversation
                        </button>
                    </h:panelGroup>

                    <h:inputTextarea id="conversation"
                                     rows="30" cols="50"
                                     readonly="true"
                                     value="#{bb.conversation}"
                                     title="Conversation entière"/>

                </h:panelGrid>
            </h:panelGrid>

            <p:separator/>

            <h:panelGroup layout="block">
                <h:outputText value="Mode Debug : "/>

                <p:toggleSwitch id="debugSwitch"
                                value="#{bb.debug}">
                    <p:ajax update="debugPanel"/>
                </p:toggleSwitch>
            </h:panelGroup>

            <h:panelGroup id="debugPanel" layout="block"
                          rendered="#{bb.debug}">

                <h3>Requête JSON envoyée à Gemini</h3>

                <h:inputTextarea id="texteRequeteJson"
                                 value="#{bb.texteRequeteJson}"
                                 rows="15" cols="100"
                                 readonly="true"/>

                <h3>Réponse JSON reçue de Gemini</h3>

                <h:inputTextarea id="texteReponseJson"
                                 value="#{bb.texteReponseJson}"
                                 rows="15" cols="100"
                                 readonly="true"/>

            </h:panelGroup>

        </h:form>
    </f:view>
</h:body>
</html>
